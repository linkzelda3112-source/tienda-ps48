<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda PS4</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0d1117; 
            color: #fff; 
            padding: 30px; 
            margin: 0; 
        }
        h1 { text-align: center; color: #1f6feb; margin-bottom: 30px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d;
            border-radius: 8px; 
            overflow: hidden; 
            padding: 15px; 
            text-align: center; 
        }
        .card img { 
            width: 100%; 
            height: 260px; 
            object-fit: cover; 
            border-radius: 4px; 
            background: #21262d; 
        }
        .card h3 { font-size: 15px; margin: 10px 0 5px; color: #58a6ff; word-break: break-word; }
        .card p { font-size: 12px; color: #8b949e; margin: 0 0 12px; font-family: monospace; }
        button { 
            background: #238636; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
        }
        button:hover { background: #2ea043; }
        .error-box { color: #f85149; text-align: center; grid-column: 1 / -1; background: #21262d; padding: 20px; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>Mi Tienda Cloud PS4</h1>
    
    <div class="grid" id="game-list">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando catálogo...</p>
    </div>

    <script>
        fetch('games.json')
            .then(res => {
                if (!res.ok) throw new Error('No se encontró el archivo games.json (Código: ' + res.status + ')');
                return res.json();
            })
            .then(games => {
                const container = document.getElementById('game-list');
                container.innerHTML = '';
                
                if (games.length === 0) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">No hay juegos en el catálogo.</p>';
                    return;
                }

                games.forEach(game => {
                    const cusa = (game.cusa || "CUSA00000").toUpperCase();
                    const coverUrl = `https://gs-sec.ww.prod.dl.playstation.net/gs/sec/app/pkg/CH0001-${cusa}_00-0000000000000000/i/icon0.png`;
                    const gameTitle = game.title || `Juego (${cusa})`;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${coverUrl}" alt="${cusa}" onerror="this.src='https://via.placeholder.com/220x260?text=${cusa}'">
                        <h3>${gameTitle}</h3>
                        <p>${cusa}</p>
                        <button onclick="installGame('${game.url}')">Instalar Juego</button>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('game-list').innerHTML = `
                    <div class="error-box">
                        <h3>⚠️ Error al cargar el catálogo</h3>
                        <p>${err.message}</p>
                        <p style="font-size: 11px; color: #8b949e; margin-top: 10px;">Revisa que el archivo <b>games.json</b> esté bien escrito y en la raíz del repositorio.</p>
                    </div>`;
            });

        function installGame(pkgUrl) {
            const endpoint = 'http://127.0.0.1:12800/api/install';
            const data = { type: "direct", packages: [pkgUrl] };

            fetch(endpoint, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert('¡Orden enviada a GoldHEN! Revisa las notificaciones de descarga en tu PS4.');
            })
            .catch(err => {
                console.error(err);
                alert('No se pudo conectar con el instalador de la consola.');
            });
        }
    </script>
</body>
</html>
