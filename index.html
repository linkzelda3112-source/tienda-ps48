<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Cloud Catalog</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090c10; 
            color: #fff; 
            padding: 20px; 
            margin: 0; 
            overflow-x: hidden;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 100%;
            margin-bottom: 20px;
            border-bottom: 2px solid #21262d;
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .dashboard-header h1 { 
            margin: 0; 
            color: #58a6ff; 
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ip-config {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .ip-config input {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
            width: 120px;
            font-weight: bold;
        }

        /* Carrusel horizontal */
        .horizontal-scroll { 
            display: flex; 
            flex-direction: row;
            gap: 15px; 
            overflow-x: auto; 
            overflow-y: hidden;
            padding: 15px 5px 25px 5px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: #161b22; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb:hover { background: #58a6ff; }

        /* Tarjeta compacta */
        .card { 
            flex: 0 0 170px; 
            width: 170px;
            background: #161b22; 
            border: 2px solid #30363d;
            border-radius: 10px; 
            overflow: hidden; 
            padding: 10px; 
            text-align: center; 
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:focus-within, .card:hover { 
            transform: scale(1.05) translateY(-4px); 
            border-color: #58a6ff; 
            box-shadow: 0 8px 20px rgba(88, 166, 255, 0.35);
            background: #1c2128;
        }
        .card img { 
            width: 100%; 
            height: 190px; 
            object-fit: cover; 
            border-radius: 6px; 
            background: #21262d; 
        }
        .card h3 { 
            font-size: 13px; 
            margin: 8px 0 3px; 
            color: #f0f6fc; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card p { 
            font-size: 10px; 
            color: #8b949e; 
            margin: 0 0 8px; 
            font-family: monospace; 
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
        }
        .btn-main { 
            background: #1f6feb; 
            color: white; 
            border: none; 
            padding: 6px; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold;
            font-size: 11px;
        }
        .btn-main:hover { background: #388bfd; }
        .btn-copy {
            background: #30363d;
            color: #c9d1d9;
            border: none;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }
        .btn-copy:hover { background: #484f58; }

        .addons-section {
            border-top: 1px solid #30363d;
            padding-top: 8px;
            margin-top: 2px;
            text-align: left;
        }
        .addons-title {
            font-size: 10px;
            color: #8b949e;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .addon-item {
            background: #0d1117;
            border: 1px solid #21262d;
            padding: 5px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }
        .addon-item span {
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85px;
        }
        .btn-sub {
            background: #238636;
            color: white;
            border: none;
            padding: 4px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            font-weight: bold;
        }
        .btn-sub:hover { background: #2ea043; }
        .empty-addons {
            font-size: 9px;
            color: #484f58;
            font-style: italic;
        }
    </style>
</head>

            <input type="text" id="ps4-ip" value="192.168.1.50">
        </div>
    </div>

        <p style="color: #8b949e;">Cargando biblioteca...</p>
