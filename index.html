<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda PS4</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0d1117; 
            color: #fff; 
            padding: 30px; 
            margin: 0; 
        }
        h1 { text-align: center; color: #1f6feb; margin-bottom: 30px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d;
            border-radius: 8px; 
            overflow: hidden; 
            padding: 15px; 
            text-align: center; 
        }
        .card img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; }
        .card h3 { font-size: 16px; margin: 10px 0 5px; }
        .card p { font-size: 13px; color: #8b949e; margin: 0 0 12px; }
        button { 
            background: #238636; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
        }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>

    <h1>Mi Tienda Cloud PS4</h1>
    
    <div class="grid" id="game-list">
        <p style="text-align: center; grid-column: 1 / -1;">Cargando catálogo...</p>
    </div>

    <script>
        fetch('games.json')
            .then(res => res.json())
            .then(games => {
                const container = document.getElementById('game-list');
                container.innerHTML = '';
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${game.image}" alt="${game.title}">
                        <h3>${game.title}</h3>
                        <p>${game.size}</p>
                        <button onclick="installGame('${game.url}')">Instalar Juego</button>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('game-list').innerHTML = '<p style="text-align: center; color: red;">Error al cargar el catálogo de juegos.</p>';
            });

        function installGame(pkgUrl) {
            const endpoint = 'http://127.0.0.1:12800/api/install';
            const data = { type: "direct", packages: [pkgUrl] };

            fetch(endpoint, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert('¡Orden enviada a GoldHEN! Revisa las notificaciones de descarga en tu PS4.');
            })
            .catch(err => {
                console.error(err);
                alert('No se pudo conectar con el instalador de la consola.');
            });
        }
    </script>
</body>
</html>
