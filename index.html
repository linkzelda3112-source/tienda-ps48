<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Payloader Store</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090c10; 
            color: #fff; 
            padding: 15px; 
            margin: 0; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #21262d;
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 18px; text-transform: uppercase; }

        .search-box {
            background: #161b22;
            border: 1px solid #30363d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            width: 200px;
            font-size: 12px;
            outline: none;
        }
        .search-box:focus { border-color: #58a6ff; }

        .horizontal-scroll { 
            display: flex; 
            gap: 15px; 
            overflow-x: auto; 
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: #161b22; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

        .card { 
            flex: 0 0 150px; 
            width: 150px;
            background: #161b22; 
            border: 2px solid #30363d;
            border-radius: 8px; 
            padding: 8px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img { 
            width: 100%; 
            height: 160px; 
            object-fit: cover; 
            border-radius: 4px; 
            background: #21262d; 
        }
        .card h3 { 
            font-size: 12px; 
            margin: 6px 0 2px; 
            color: #f0f6fc; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card p { font-size: 9px; color: #8b949e; margin: 0 0 6px; font-family: monospace; }

        .btn-install { 
            background: #238636; 
            color: white; 
            border: none; 
            padding: 6px; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold;
            font-size: 11px;
        }
        .btn-install:hover { background: #2ea043; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Mi Tienda Payloader</h1>
        <input type="text" id="search-box" class="search-box" placeholder="🔍 Buscar juego..." oninput="filterGames()">
    </div>
    
    <div class="horizontal-scroll" id="game-list">
        <p style="color: #8b949e;">Cargando catálogo...</p>
    </div>

                renderGames(allGames);

                console.error(err);
