<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Aurora Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090c10; 
            color: #fff; 
            padding: 30px; 
            margin: 0; 
            overflow-x: hidden;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1300px;
            margin: 0 auto 30px auto;
            border-bottom: 2px solid #21262d;
            padding-bottom: 15px;
        }
        .dashboard-header h1 { 
            margin: 0; 
            color: #58a6ff; 
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .status-badge {
            background: #238636;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(35, 134, 54, 0.4);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 25px; 
            max-width: 1300px; 
            margin: 0 auto; 
        }

        .card { 
            background: #161b22; 
            border: 2px solid #30363d;
            border-radius: 12px; 
            overflow: hidden; 
            padding: 15px; 
            text-align: center; 
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:focus-within, .card:hover { 
            transform: scale(1.03); 
            border-color: #58a6ff; 
            box-shadow: 0 10px 30px rgba(88, 166, 255, 0.3);
            background: #1c2128;
        }

        .card img { 
            width: 100%; 
            height: 280px; 
            object-fit: cover; 
            border-radius: 8px; 
            background: #21262d; 
        }

        .card h3 { 
            font-size: 15px; 
            margin: 12px 0 4px; 
            color: #f0f6fc; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card p { 
            font-size: 11px; 
            color: #8b949e; 
            margin: 0 0 12px; 
            font-family: monospace; 
        }

        .btn-main { 
            background: #1f6feb; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .btn-main:hover { background: #388bfd; }

        /* Sección de Updates & DLCs */
        .addons-section {
            border-top: 1px solid #30363d;
            padding-top: 10px;
            margin-top: 5px;
            text-align: left;
        }
        .addons-title {
            font-size: 12px;
            color: #8b949e;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .addon-item {
            background: #0d1117;
            border: 1px solid #21262d;
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }
        .btn-sub {
            background: #238636;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }
        .btn-sub:hover { background: #2ea043; }
        .empty-addons {
            font-size: 11px;
            color: #484f58;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h1>🎮 PS4 Cloud Dashboard</h1>
        <div class="status-badge">GoldHEN Ready</div>
    </div>
    
    <div class="grid" id="game-list">
        <p style="text-align: center; grid-column: 1 / -1; color: #8b949e;">Cargando biblioteca...</p>
    </div>

    <script>
        fetch('games.json')
            .then(res => {
                if (!res.ok) throw new Error('No se encontró el archivo games.json');
                return res.json();
            })
            .then(games => {
                const container = document.getElementById('game-list');
                container.innerHTML = '';

                games.forEach((game, index) => {
                    const cusa = (game.cusa || "CUSA00000").toUpperCase();
                    const coverUrl = `https://gs-sec.ww.prod.dl.playstation.net/gs/sec/app/pkg/CH0001-${cusa}_00-0000000000000000/i/icon0.png`;
                    const gameTitle = game.title || `Juego (${cusa})`;

                    // Renderizar actualizaciones
                    let updatesHtml = '<div class="empty-addons">Sin actualizaciones</div>';
                    if (game.updates && game.updates.length > 0) {
                        updatesHtml = game.updates.map(up => `
                            <div class="addon-item">
                                <span>${up.name}</span>
                                <button class="btn-sub" onclick="installGame('${up.url}')">Instalar</button>
                            </div>
                        `).join('');
                    }

                    // Renderizar DLCs
                    let dlcsHtml = '<div class="empty-addons">Sin DLCs disponibles</div>';
                    if (game.dlcs && game.dlcs.length > 0) {
                        dlcsHtml = game.dlcs.map(dlc => `
                            <div class="addon-item">
                                <span>${dlc.name}</span>
                                <button class="btn-sub" onclick="installGame('${dlc.url}')">Instalar</button>
                            </div>
                        `).join('');
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.tabIndex = index + 1;
                    card.innerHTML = `
                        <div>
                            <img src="${coverUrl}" alt="${cusa}" onerror="this.src='https://via.placeholder.com/240x280?text=${cusa}'">
                            <h3>${gameTitle}</h3>
                            <p>${cusa}</p>
                            <button class="btn-main" onclick="installGame('${game.url}')">Instalar Juego Base</button>
                        </div>
                        
                        <div class="addons-section">
                            <div class="addons-title">🔄 Actualizaciones</div>
                            ${updatesHtml}
                            <div class="addons-title" style="margin-top: 8px;">🧩 DLCs / Contenido</div>
                            ${dlcsHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('game-list').innerHTML = `<p style="color: red; text-align: center;">Error al cargar catálogo.</p>`;
            });

        function installGame(pkgUrl) {
            const endpoint = 'http://127.0.0.1:12800/api/install';
            const data = { type: "direct", packages: [pkgUrl] };

            fetch(endpoint, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert('¡Petición enviada a GoldHEN! Revisa tus notificaciones de descarga.');
            })
            .catch(err => {
                console.error(err);
                alert('No se pudo enviar la orden a la consola.');
            });
        }
    </script>
</body>
</html>
