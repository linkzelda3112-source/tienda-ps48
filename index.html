<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Remote Store</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090c10; 
            color: #fff; 
            padding: 20px; 
            margin: 0; 
            overflow-x: hidden;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 100%;
            margin-bottom: 20px;
            border-bottom: 2px solid #21262d;
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .dashboard-header h1 { 
            margin: 0; 
            color: #58a6ff; 
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .search-container input {
            background: #161b22;
            border: 1px solid #30363d;
            color: #fff;
            padding: 7px 14px;
            border-radius: 6px;
            width: 220px;
            font-size: 13px;
            outline: none;
        }
        .search-container input:focus { border-color: #58a6ff; }

        .status-badge {
            background: #238636;
            color: #fff;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(35, 134, 54, 0.4);
        }

        .horizontal-scroll { 
            display: flex; 
            flex-direction: row;
            gap: 15px; 
            overflow-x: auto; 
            overflow-y: hidden;
            padding: 15px 5px 25px 5px;
            scroll-behavior: smooth;
        }

        .horizontal-scroll::-webkit-scrollbar-track { background: #161b22; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
