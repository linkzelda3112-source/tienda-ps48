<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Payloader Store</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090c10; 
            color: #fff; 
            padding: 15px; 
            margin: 0; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #21262d;
            padding-bottom: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 18px; text-transform: uppercase; }

        .search-box {
            background: #161b22;
            border: 1px solid #30363d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            width: 200px;
            font-size: 12px;
            outline: none;
        }
        .search-box:focus { border-color: #58a6ff; }

        .horizontal-scroll { 
            display: flex; 
            gap: 15px; 
            overflow-x: auto; 
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: #161b22; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

        .card { 
            flex: 0 0 160px; 
            width: 160px;
            background: #161b22; 
            border: 2px solid #30363d;
            border-radius: 8px; 
            padding: 10px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img { 
            width: 100%; 
            height: 170px; 
            object-fit: cover; 
            border-radius: 4px; 
            background: #21262d; 
        }
        .card h3 { 
            font-size: 12px; 
            margin: 6px 0 2px; 
            color: #f0f6fc; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card p { font-size: 9px; color: #8b949e; margin: 0 0 6px; font-family: monospace; }

        .btn-install { 
            background: #238636; 
            color: white; 
            border: none; 
            padding: 6px; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold;
            font-size: 11px;
        }
        .btn-install:hover { background: #2ea043; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Mi Tienda Payloader</h1>
        <input type="text" id="search-box" class="search-box" placeholder="🔍 Buscar juego..." oninput="filterGames()">
    </div>
    
    <div class="horizontal-scroll" id="game-list">
        <!-- Los juegos se cargan automáticamente aquí -->
    </div>

    <script>
        // Lista de juegos integrada directamente (con todos tus enlaces y juegos listos)
        const games = [
            {
                cusa: "CUSA00000",
                title: "The Legend of Zelda 64",
                url: "https://archive.org/download/zelda-64-seth-viveros/Zelda%2064%20SETH%20VIVEROS.pkg"
            },
            {
                cusa: "CUSA00265",
                title: "Minecraft: PS4 Edition",
                image: "https://m.media-amazon.com/images/I/81S88mToW3L._AC_SX385_.jpg",
                url: "https://archive.org/download/super-psx-minecraft.-play-station-4.-edition-cusa-00265-v-1.00-1.70-opoisso-893/%5BSuperPSX%5D-Minecraft.PlayStation4.Edition_CUSA00265_v1.00_%5B1.70%5D_OPOISSO893.pkg"
            },
            {
                cusa: "CUSA00740",
                title: "Terraria",
                url: "https://archive.org/download/super-psx-terraria-cusa-00740-v-1.00-1.75-ps-4/%5BSuperPSX%5D-Terraria_CUSA00740_v1.00_%5B1.75%5D-PS4.pkg"
            },
            {
                cusa: "CUSA08992",
                title: "Dragon Ball FighterZ",
                url: "https://archive.org/download/super-psx-dragon.-ball.-fighter-z-cusa-08992-v-1.00-5.05-ps-4/%5BSuperPSX%5D-DRAGON.BALL.FighterZ_CUSA08992_v1.00_%5B5.05%5D-PS4.pkg"
            },
            {
                cusa: "CUSA00000",
                title: "DBZ Tenkaichi 4",
                url: "https://archive.org/download/tenkaichi-4-ps-4/Tenkaichi%204%20ps4.pkg"
            }
        ];

        function renderGames(gamesArray) {
            const container = document.getElementById('game-list');
            container.innerHTML = '';

            if (gamesArray.length === 0) {
                container.innerHTML = `<p style="color: #8b949e; padding: 10px;">No se encontraron juegos.</p>`;
                return;
            }

            gamesArray.forEach((game) => {
                const cusa = (game.cusa || "CUSA00000").toUpperCase();
                const coverUrl = game.image || `https://gs-sec.ww.prod.dl.playstation.net/gs/sec/app/pkg/CH0001-${cusa}_00-0000000000000000/i/icon0.png`;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <img src="${coverUrl}" alt="${cusa}" onerror="this.src='https://via.placeholder.com/150x160?text=${cusa}'">
                        <h3>${game.title}</h3>
                        <p>${cusa}</p>
                    </div>
                    <button class="btn-install" onclick="sendPayloader('${game.url}')">Instalar</button>
                `;
                container.appendChild(card);
            });
        }

        function filterGames() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = games.filter(game => 
                (game.title || "").toLowerCase().includes(query) || 
                (game.cusa || "").toLowerCase().includes(query)
            );
            renderGames(filtered);
        }

        // Función que manda la orden al Payloader de GoldHEN
        function sendPayloader(pkgUrl) {
            const endpoint = 'http://127.0.0.1:12800/api/install';
            const payload = { type: "direct", packages: [pkgUrl] };

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('¡Enviado a GoldHEN! La descarga comenzará en segundo plano.');
            })
            .catch(() => {
                fetch('http://127.0.0.1:9090', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(() => alert('¡Enviado por Payloader (9090)!'))
                .catch(() => alert('Error: Verifica que Enable PayLoader Server esté activo en GoldHEN.'));
            });
        }

        // Renderizar la lista inicial al abrir la página
        renderGames(games);
    </script>
</body>
</html>
